server_tokens off;

# Реальный IP клиента передаётся внешним Nginx на сервере
# через X-Real-IP, поэтому используем его для rate limiting.
limit_req_zone $http_x_real_ip zone=req_limit_per_ip:10m rate=200r/s;
limit_conn_zone $http_x_real_ip zone=addr:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    client_max_body_size 105M;
    client_body_timeout 60s;

    access_log off;
    error_log /var/log/nginx/error.log error;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        application/ecmascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ─────────────────────────────────────────────
    # Static
    # ─────────────────────────────────────────────

    location /static/ {
        alias /staticfiles/;
        autoindex off;
        access_log off;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";

        try_files $uri $uri/ =404;
    }

    # ─────────────────────────────────────────────
    # Public media
    # ─────────────────────────────────────────────

    location /media/ {
        alias /mediafiles/public/;
        autoindex off;
        access_log off;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        try_files $uri $uri/ =404;
    }

    # ─────────────────────────────────────────────
    # Grafana WebSockets (Live) - Без auth_request
    # ─────────────────────────────────────────────
    location /__grafana__/api/live/ws {
        limit_req zone=req_limit_per_ip burst=50 nodelay;
        limit_conn addr 20;

        proxy_pass http://ts_core_grafana:3000;
        proxy_http_version 1.1;

        # Фиксируем заголовки веб-сокетов для надежности в связке двух прокси
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
    }

    # ─────────────────────────────────────────────
    # Grafana (Debug вариант)
    # ─────────────────────────────────────────────

    # location /__grafana__/ {
    #     limit_req zone=req_limit_per_ip burst=50 nodelay;
    #     limit_conn addr 20;

    #     proxy_pass http://ts_core_grafana:3000;
    #     proxy_http_version 1.1;

    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $http_x_real_ip;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 120s;
    #     proxy_read_timeout 120s;

    #     proxy_buffering off;
    # }

    # ─────────────────────────────────────────────
    # Grafana (Удобный вариант)
    # ─────────────────────────────────────────────

    location /__grafana__/ {
        limit_req zone=req_limit_per_ip burst=50 nodelay;
        limit_conn addr 20;

        # Отправляем запрос на невидимую внутреннюю проверку в Django
        auth_request /__grafana_auth_check__;

        # Перехватываем X-WEBAUTH-USER, который вернул Django, и сохраняем его
        auth_request_set $auth_user $upstream_http_x_webauth_user;
        proxy_set_header X-WEBAUTH-USER $auth_user;

        proxy_pass http://ts_core_grafana:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /__grafana__;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
    }

    # Внутренний роут-посредник шлюза (скрыт от интернета)
    location = /__grafana_auth_check__ {
        internal;
        
        # Передаем параметры токена ($is_args$args) в контейнер Django
        proxy_pass http://ts_core_backend:8000/grafana/auth/$is_args$args;
        
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        
        # Передаем оригинальный домен для Django ALLOWED_HOSTS и куки сессии
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ─────────────────────────────────────────────
    # WebSocket
    # ─────────────────────────────────────────────

    location /ws/ {
        proxy_pass http://ts_core_backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # ─────────────────────────────────────────────
    # Prometheus
    # Наружу endpoint не публикуем.
    # Prometheus обращается к Django напрямую
    # по Docker-сети.
    # ─────────────────────────────────────────────

    location /__prometheus__/ {
        return 404;
    }

    # ─────────────────────────────────────────────
    # Django
    # ─────────────────────────────────────────────

    location / {
        limit_req zone=req_limit_per_ip burst=100 nodelay;
        limit_conn addr 200;

        proxy_pass http://ts_core_backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 64k;

        proxy_request_buffering off;
    }
}